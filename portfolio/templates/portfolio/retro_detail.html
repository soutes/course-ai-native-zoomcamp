<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>weekly - retro {{ week }}</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font: 15px/1.6 ui-monospace, "Cascadia Code", Consolas, monospace;
      max-width: 52rem; margin: 3rem auto; padding: 0 1.5rem;
    }
    h1 { font-size: 1.4rem; margin-bottom: .2rem; }
    h2 { font-size: 1rem; margin-top: 2.5rem; text-transform: uppercase;
         letter-spacing: .08em; opacity: .6; }
    .sub { opacity: .6; margin-top: 0; }
    ul { padding-left: 1.2rem; }
    li { padding: .3rem 0; }
    a { color: inherit; }
    code { opacity: .85; }
  </style>

<body>
  <p class="sub"><a href="{% url 'portfolio:retro_list' %}">&larr; all retros</a></p>

  {{ report_html|safe }}
